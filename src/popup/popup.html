<!doctype html>
<html lang="en" data-cp-palette="atlas">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CommPilot settings</title>
  <!-- The themes' colours: each palette's tokens apply to any element with data-cp-palette (theme-palettes.css). -->
  <link rel="stylesheet" href="../content/theme-palettes.css">
  <link rel="stylesheet" href="popup.css">
  <script src="../content/themes.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <main class="settings">
    <header class="settings-header">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <rect x="3" y="5" width="26" height="22" rx="7" stroke="currentColor" stroke-width="2"/>
          <path d="M9 17h4l2-5 3 9 2-4h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <p class="eyebrow">CommPilot 2.0</p>
        <h1>Settings</h1>
      </div>
    </header>

    <section class="appearance" aria-labelledby="appearance-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Appearance</p>
          <h2 id="appearance-title">Choose your theme</h2>
        </div>
        <div class="mode" role="radiogroup" aria-label="Light or dark">
          <label><input type="radio" name="mode" value="light">Light</label>
          <label><input type="radio" name="mode" value="dark">Dark</label>
        </div>
      </div>
      <p class="intro">Every theme comes light and dark. Your choice is saved and follows you across CommPilot tabs.</p>
      <fieldset class="theme-grid" id="palette-grid">
        <legend class="sr-only">Theme</legend>
      </fieldset>
    </section>

    <footer class="settings-footer"><span class="status-dot" aria-hidden="true"></span><span id="save-status" role="status" aria-live="polite">Loading your preference…</span></footer>
  </main>
</body>
</html>
